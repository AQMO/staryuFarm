<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>TabBar管理 - 星语农庄管理后台</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/theme-chalk/index.css">
    <style>
        [v-cloak] { display: none; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .layout { min-height: 100vh; }
        .sidebar { width: 220px; background: #2c3e50; min-height: 100vh; position: fixed; left: 0; top: 0; overflow-y: auto; z-index: 100; }
        .sidebar-title { padding: 20px; color: #fff; font-size: 18px; font-weight: bold; text-align: center; border-bottom: 1px solid #3d4d5e; }
        .sidebar-title .green { color: #4ade80; }
        .menu-item { padding: 14px 20px; color: #b0b8c1; cursor: pointer; font-size: 14px; }
        .menu-item:hover { background: #3d4d5e; color: #fff; }
        .menu-item.active { background: #16a34a; color: #fff; }
        .main-content { margin-left: 220px; padding: 20px; background: #f5f7fa; min-height: 100vh; }
        .page-header { background: #fff; padding: 16px 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .page-header h2 { margin: 0; font-size: 20px; color: #303133; }
        .content-card { background: #fff; border-radius: 8px; padding: 20px; }
        .icon-preview { width: 40px; height: 40px; object-fit: contain; }
        .icon-cell { display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>
<div id="app" v-cloak>
    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-title"><span class="green">星语</span>农庄</div>
            <div v-for="menu in sidebarMenus" :key="menu.id" class="menu-item" :class="{ active: currentMenu === menu.menuKey }" @click="goTo(menu.url)">
                {{ menu.icon }} {{ menu.name }}
            </div>
        </div>

        <div class="main-content">
            <div class="page-header">
                <h2>TabBar管理</h2>
                <div>
                    <span style="margin-right: 15px; color: #606266;">{{ adminName }}</span>
                    <el-button type="text" @click="logout">退出登录</el-button>
                </div>
            </div>

            <div class="content-card">
                <div style="margin-bottom: 20px;">
                    <el-button type="primary" icon="el-icon-plus" @click="showAddDialog">添加Tab项</el-button>
                    <span style="margin-left: 15px; color: #909399; font-size: 13px;">管理小程序底部导航栏的图标、名称和跳转路径</span>
                </div>

                <el-table :data="list" border stripe>
                    <el-table-column prop="sortOrder" label="排序" width="80" align="center"></el-table-column>
                    <el-table-column label="名称" width="120">
                        <template slot-scope="scope">
                            <el-tag size="small">{{ scope.row.name }}</el-tag>
                        </template>
                    </el-table-column>
                    <el-table-column prop="pagePath" label="页面路径" min-width="180"></el-table-column>
                    <el-table-column label="默认图标" width="100" align="center">
                        <template slot-scope="scope">
                            <img v-if="scope.row.iconPath" :src="scope.row.iconPath" class="icon-preview">
                            <span v-else style="color: #c0c4cc;">无</span>
                        </template>
                    </el-table-column>
                    <el-table-column label="选中图标" width="100" align="center">
                        <template slot-scope="scope">
                            <img v-if="scope.row.selectedIconPath" :src="scope.row.selectedIconPath" class="icon-preview">
                            <span v-else style="color: #c0c4cc;">无</span>
                        </template>
                    </el-table-column>
                    <el-table-column label="状态" width="80" align="center">
                        <template slot-scope="scope">
                            <el-tag :type="scope.row.isVisible === 1 ? 'success' : 'info'" size="small">
                                {{ scope.row.isVisible === 1 ? '显示' : '隐藏' }}
                            </el-tag>
                        </template>
                    </el-table-column>
                    <el-table-column label="操作" width="160" align="center">
                        <template slot-scope="scope">
                            <el-button size="mini" type="primary" @click="showEditDialog(scope.row)">编辑</el-button>
                            <el-button size="mini" type="danger" @click="handleDelete(scope.row)">删除</el-button>
                        </template>
                    </el-table-column>
                </el-table>
            </div>
        </div>
    </div>

    <!-- 添加/编辑弹窗 -->
    <el-dialog :title="dialogTitle" :visible.sync="dialogVisible" width="550px" @closed="resetForm">
        <el-form :model="form" label-width="100px">
            <el-form-item label="名称" required>
                <el-input v-model="form.name" placeholder="例如：首页"></el-input>
            </el-form-item>
            <el-form-item label="页面路径" required>
                <el-input v-model="form.pagePath" placeholder="例如：pages/home/index"></el-input>
            </el-form-item>
            <el-form-item label="默认图标">
                <el-upload action="/api/file/upload" :data="{ directory: 'tabbar' }" :show-file-list="false"
                           :on-success="(res) => handleIconSuccess(res, 'iconPath')"
                           :before-upload="beforeUpload">
                    <el-button size="small" type="primary">上传图标</el-button>
                    <span style="margin-left:10px; color:#909399; font-size:12px;">建议81x81px PNG</span>
                </el-upload>
                <el-input v-model="form.iconPath" placeholder="或输入图标URL" style="margin-top:10px;"></el-input>
                <img v-if="form.iconPath" :src="form.iconPath" style="width:40px;height:40px;margin-top:10px;">
            </el-form-item>
            <el-form-item label="选中图标">
                <el-upload action="/api/file/upload" :data="{ directory: 'tabbar' }" :show-file-list="false"
                           :on-success="(res) => handleIconSuccess(res, 'selectedIconPath')"
                           :before-upload="beforeUpload">
                    <el-button size="small" type="primary">上传图标</el-button>
                    <span style="margin-left:10px; color:#909399; font-size:12px;">建议81x81px PNG（绿色）</span>
                </el-upload>
                <el-input v-model="form.selectedIconPath" placeholder="或输入图标URL" style="margin-top:10px;"></el-input>
                <img v-if="form.selectedIconPath" :src="form.selectedIconPath" style="width:40px;height:40px;margin-top:10px;">
            </el-form-item>
            <el-form-item label="排序">
                <el-input-number v-model="form.sortOrder" :min="0" :max="100"></el-input-number>
            </el-form-item>
            <el-form-item label="是否显示">
                <el-switch v-model="form.isVisible" :active-value="1" :inactive-value="0"></el-switch>
            </el-form-item>
        </el-form>
        <div slot="footer">
            <el-button @click="dialogVisible = false">取消</el-button>
            <el-button type="primary" @click="submitForm">确定</el-button>
        </div>
    </el-dialog>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/index.js"></script>
<script src="/static/js/admin-common.js"></script>
<script>
new Vue({
    el: '#app',
    data: {
        currentMenu: 'tabbar',
        sidebarMenus: [],
        adminName: '',
        list: [],
        dialogVisible: false,
        dialogTitle: '添加Tab项',
        isEdit: false,
        form: {
            id: null, name: '', pagePath: '', iconPath: '', selectedIconPath: '',
            sortOrder: 0, isVisible: 1
        }
    },
    mounted() {
        initAdminPage(this, 'tabbar');
        this.loadList();
    },
    methods: {
        goTo(url) { window.location.href = url; },
        logout() { adminLogout(); },
        loadList() {
            $.getJSON('/api/tabbar/list', (res) => {
                this.list = res.data || [];
            });
        },
        showAddDialog() {
            this.isEdit = false;
            this.dialogTitle = '添加Tab项';
            this.dialogVisible = true;
            if (this.list.length > 0) {
                this.form.sortOrder = Math.max(...this.list.map(i => i.sortOrder || 0)) + 1;
            }
        },
        showEditDialog(row) {
            this.isEdit = true;
            this.dialogTitle = '编辑Tab项';
            this.form = { ...row };
            this.dialogVisible = true;
        },
        resetForm() {
            this.form = { id: null, name: '', pagePath: '', iconPath: '', selectedIconPath: '', sortOrder: 0, isVisible: 1 };
        },
        beforeUpload(file) {
            const isImage = file.type.startsWith('image/');
            const isLt10M = file.size / 1024 / 1024 < 10;
            if (!isImage) this.$message.error('只能上传图片文件!');
            if (!isLt10M) this.$message.error('图片大小不能超过10MB!');
            return isImage && isLt10M;
        },
        handleIconSuccess(res, field) {
            if (res.success) {
                this.form[field] = res.url;
                this.$message.success('图标上传成功');
            } else {
                this.$message.error(res.error || '上传失败');
            }
        },
        submitForm() {
            if (!this.form.name || !this.form.pagePath) {
                this.$message.warning('请填写名称和页面路径');
                return;
            }
            const method = this.isEdit ? 'PUT' : 'POST';
            const url = this.isEdit ? '/api/tabbar/' + this.form.id : '/api/tabbar';
            $.ajax({
                url: url,
                method: method,
                contentType: 'application/json',
                data: JSON.stringify(this.form),
                success: (res) => {
                    if (res.success) {
                        this.$message.success(this.isEdit ? '更新成功' : '添加成功');
                        this.dialogVisible = false;
                        this.loadList();
                    } else {
                        this.$message.error(res.error || '操作失败');
                    }
                },
                error: () => { this.$message.error('网络错误'); }
            });
        },
        handleDelete(row) {
            this.$confirm('确认删除该Tab项？删除后小程序底部将不显示此项', '提示', { type: 'warning' })
                .then(() => {
                    $.ajax({
                        url: '/api/tabbar/' + row.id,
                        method: 'DELETE',
                        success: (res) => {
                            if (res.success) {
                                this.$message.success('删除成功');
                                this.loadList();
                            } else {
                                this.$message.error(res.error || '删除失败');
                            }
                        }
                    });
                }).catch(() => {});
        }
    }
});
</script>
</body>
</html>
